<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Second Wind">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Second Wind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5EFE4; --cream-deep:#EDE3D4; --bark:#3D2B1F; --bark-mid:#6B4F3A; --soil:#8B6347;
  --moss:#4A6741; --sage:#7A9E6E; --sage-light:#B8CDB0; --clay:#C97A6E; --blush:#DBA898;
  --gold:#B8935A; --gold-light:#D4B47A; --border:#DDD4C4; --glass:rgba(255,255,255,.42);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--bark);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.5}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--bark)}
.shell{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 96px)}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.005em}
h1{font-size:34px;line-height:1.1}
h2{font-size:26px;line-height:1.15}
h3{font-size:21px}
.muted{color:var(--bark-mid)}
.small{font-size:13.5px}
.serif{font-family:var(--serif)}
.card{background:#FBF7F0;border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:100px;padding:13px 22px;background:var(--moss);color:var(--cream);font-weight:400;font-size:15.5px;transition:transform .2s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--bark);border:1px solid var(--border)}
.btn.soft{background:var(--cream-deep);color:var(--bark)}
.btn:disabled{opacity:.4}
.link{background:none;border:none;color:var(--bark-mid);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:14px}
.field{width:100%;border:1px solid var(--border);background:#FFFCF7;border-radius:12px;padding:12px 14px;font-size:15.5px;outline:none}
.field:focus{border-color:var(--sage)}
textarea.field{min-height:76px;resize:vertical}
label.lbl{display:block;font-weight:400;font-size:14.5px;margin:16px 0 6px}
.hint{font-size:12.5px;color:var(--bark-mid);margin-top:4px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Help now — always visible, calm, high contrast */
.help-pill{position:fixed;z-index:40;top:calc(env(safe-area-inset-top) + 12px);right:max(14px, calc(50% - 201px));background:var(--bark);color:var(--cream);border:none;border-radius:100px;padding:9px 16px;font-size:14px;font-weight:400;box-shadow:0 2px 10px rgba(61,43,31,.18)}

/* Header */
.top{padding-right:96px}
.season{display:flex;align-items:center;gap:10px;margin-top:10px}
.season-bar{flex:1;height:4px;background:var(--cream-deep);border-radius:4px;overflow:hidden}
.season-bar i{display:block;height:100%;background:var(--sage);border-radius:4px;transition:width 1s ease}

/* Greenhouse */
.greenhouse{position:relative;margin:18px 0 8px;border-radius:22px 22px 16px 16px;padding:40px 6px 12px;background:linear-gradient(180deg,#EEF1E4 0%,#F3EEE2 60%,#EDE3D4 100%);border:1px solid var(--border);overflow:hidden}
.gh-frame{position:absolute;inset:0;pointer-events:none}
.plants{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 2px}
.plant{background:none;border:none;padding:4px 0 8px;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.plant svg{width:100px;height:130px;overflow:visible}
.plant .name{font-size:13px;margin-top:2px;display:flex;align-items:center;gap:4px}
.plant .state{font-size:11px;color:var(--bark-mid);height:15px}
.plant.dormant svg{filter:saturate(.55) brightness(1.02)}
.sway{transform-origin:40px 84px;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.drop{position:absolute;left:50%;top:6px;width:7px;height:10px;background:#8FB5C9;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;pointer-events:none}
.drop.go{animation:drop .8s ease-in forwards}
@keyframes drop{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,42px)}}
.hardy{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--bark-mid)}

/* Bird */
.bird-wrap{position:absolute;top:8px;right:16px;width:64px;height:54px;z-index:2;background:none;border:none;padding:0}
.bird-wrap.arrive{animation:arrive 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes arrive{0%{transform:translate(-160px,-50px) rotate(-8deg);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
.bird-wrap .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:30px 44px}
@keyframes bob{0%,100%{transform:rotate(0)}40%{transform:rotate(-4deg)}55%{transform:rotate(2deg)}}
.envelope{position:absolute;right:-6px;bottom:-2px;width:22px;height:16px;background:#FFFCF7;border:1px solid var(--gold);border-radius:3px}
.envelope:after{content:"";position:absolute;left:2px;right:2px;top:1px;height:8px;border-bottom:1px solid var(--gold);border-left:0;transform:skewY(0);background:linear-gradient(160deg,transparent 48%,var(--gold) 50%,transparent 52%),linear-gradient(20deg,transparent 48%,var(--gold) 50%,transparent 52%)}

/* Nav */
.nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(245,239,228,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
.nav button{background:none;border:none;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;color:var(--bark-mid)}
.nav button.on{color:var(--moss);font-weight:400}
.nav svg{width:22px;height:22px}

/* Sheets / modals */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(61,43,31,.28);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--cream);border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .close{display:block;margin:-6px -2px 4px auto;background:none;border:none;font-size:14px;color:var(--bark-mid);padding:4px 2px}
.crisis{display:block;width:100%;text-align:left;background:var(--bark);color:var(--cream);border:none;border-radius:14px;padding:14px 16px;margin:8px 0;text-decoration:none}
.crisis b{font-weight:500;font-size:16px;display:block}
.crisis span{font-size:13px;opacity:.85}
.crisis.lite{background:#FBF7F0;color:var(--bark);border:1px solid var(--border)}
.person{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.person:last-child{border-bottom:none}
.person a{color:var(--moss);text-decoration:none;font-weight:400}

/* Mood */
.moods{display:flex;gap:8px;margin:14px 0}
.mood{flex:1;border:1px solid var(--border);background:#FFFCF7;border-radius:14px;padding:12px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
.mood .n{font-family:var(--serif);font-size:24px;line-height:1}
.mood.on{background:var(--sage-light);border-color:var(--sage)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--border);background:#FFFCF7;border-radius:100px;padding:9px 14px;font-size:14px}
.chip.on{background:var(--moss);color:var(--cream);border-color:var(--moss)}

/* Onboarding */
.ob{min-height:calc(100vh - 140px);display:flex;flex-direction:column}
.ob-step{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bark-mid);margin-bottom:22px}
.ob-dots{display:flex;gap:5px;margin-bottom:8px;margin-right:110px}
.ob-dots i{height:3px;flex:1;border-radius:3px;background:var(--cream-deep)}
.ob-dots i.on{background:var(--sage)}
.ob p.lead{font-family:var(--serif);font-size:22px;line-height:1.35;margin:14px 0}
.ob .spacer{flex:1;min-height:24px}
.ob-actions{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:20px}

/* Plan */
.plan-sec{margin:14px 0 4px}
.plan-sec h4{margin:0 0 6px;font-weight:400;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--bark-mid)}
.plan-sec ul{margin:0;padding-left:20px}
.plan-sec li{margin:3px 0}
.plan-sec .num{font-family:var(--serif);color:var(--gold);font-size:18px;margin-right:6px}

/* Breathing */
.breath{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.breath svg{width:220px;height:220px}
.breath .phase{font-family:var(--serif);font-size:28px;margin-top:6px;min-height:40px}
.trace{stroke-dasharray:100;stroke-dashoffset:100;animation:trace 16s linear infinite}
@keyframes trace{to{stroke-dashoffset:0}}

/* Letter */
.letter{background:#FFFCF7;border:1px solid var(--border);border-radius:6px;padding:26px 22px;box-shadow:0 8px 30px rgba(61,43,31,.08);font-family:var(--serif);font-size:21px;line-height:1.4;position:relative;margin:10px 0 16px}
.letter .from{font-family:var(--sans);font-size:12.5px;color:var(--bark-mid);margin-top:14px}
.quote{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.35}
.quote small{display:block;font-style:normal;font-family:var(--sans);font-size:12.5px;color:var(--bark-mid);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--bark);color:var(--cream);padding:10px 18px;border-radius:100px;font-size:14px;z-index:60;animation:toast 2.8s ease forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.banner{background:var(--cream-deep);border-radius:12px;padding:10px 14px;font-size:13.5px;margin:10px 0}
hr.soft{border:none;border-top:1px solid var(--border);margin:18px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ---------------- Content ---------------- */
const STARTER = [
  {id:'water',  name:'water',   icon:'💧', color:'#7FA7B8', why:'Your body is doing the work. Give it water.'},
  {id:'meds',   name:'meds',    icon:'🌿', color:'#7A9E6E', why:'Taking your medicine is a way of keeping a promise to yourself.'},
  {id:'dressed',name:'dressed', icon:'👕', color:'#C4A55A', why:'Getting dressed tells your day it has started.'},
  {id:'shower', name:'shower',  icon:'🫧', color:'#9B8DB5', why:'Warm water is a small reset.'},
  {id:'outside',name:'outside', icon:'🌤', color:'#8FB5A0', why:'Fresh air and sky are always available.'},
  {id:'ate',    name:'ate',     icon:'🍵', color:'#C97A6E', why:'Feeding yourself is care, not a chore.'}
];
const NEW_SEEDS = [
  {id:'pottery', name:'pottery', icon:'🏺', color:'#B8935A'},
  {id:'friend',  name:'call a friend', icon:'📞', color:'#D48A9B'},
  {id:'breathe', name:'box breathing', icon:'🫁', color:'#7A9BB5'},
  {id:'journal', name:'journal', icon:'📓', color:'#7B6EA0'},
  {id:'move',    name:'move', icon:'🚶', color:'#C4B447'},
  {id:'music',   name:'music', icon:'🎶', color:'#8FB5A0'},
  {id:'flowers', name:'flowers', icon:'💐', color:'#DBA898'},
  {id:'rest',    name:'extra rest', icon:'🌙', color:'#5C6B8A'}
];
const SMALL_THINGS = [
  'Text a friend','Take a shower or bath','Cold compress on your forehead','Five minutes of box breathing',
  'Write a few lines in a notebook','Draw, paint or take a photo','Pottery','A short walk around the block',
  'Some extra rest','Listen to music, hum or sing','Buy or smell some flowers','Put on your favorite perfume',
  'Wear something that makes you feel good','Look through old photos','Watch something funny',
  'Do something kind for someone','Sit in the sun for ten minutes','List three small things you did today'
];
const QUOTES = [
  ['Never let the things you cannot do prevent you from doing the things you can.','John Wooden'],
  ['We must accept finite disappointment, but never lose infinite hope.','Martin Luther King Jr.'],
  ['Surrounding that non-choice is a million other choices that I can make.','Michael J. Fox'],
  ['Courage does not always roar. Sometimes courage is the quiet voice at the end of the day saying, “I will try again tomorrow.”','Mary Anne Radmacher'],
  ['The only thing that can grow is the thing you give energy to.','attributed to Ralph Waldo Emerson'],
  ['It’s one of the greatest gifts you can give yourself, to forgive.','Maya Angelou'],
  ['To be alive at all is to have scars.','John Steinbeck'],
  ['Go wisely and slowly. Those who rush stumble and fall.','William Shakespeare'],
  ['Crying does not indicate that you are weak. Since birth, it has always been a sign that you are alive.','attributed to Charlotte Brontë'],
  ['The secret of change is to focus all of your energy, not on fighting the old, but on building the new.','attributed to Socrates'],
  ['It takes sadness to know happiness, noise to appreciate silence, the night to appreciate daylight.','Anonymous'],
  ['You are relearning who you are. Breathe, even rediscoveries take patience and time.','L.E. Bowman']
];
const WARM = ['One step at a time.','That counts.','You are capable.','That’s one small way of treating yourself well.','Gently done.','Thank you for tending this.'];
const MOODS = [[1,'very hard'],[2,'hard'],[3,'okay'],[4,'good'],[5,'light']];
const MILESTONES = {
  3:'Three days in your greenhouse. Something is taking root.',
  7:'One week of showing up. That is real, and it is yours.',
  14:'Two weeks. Look how much you have tended.',
  30:'Thirty days. Your greenhouse remembers every one of them.',
  60:'Sixty days. You kept coming back, one step at a time.',
  90:'Ninety days. Your first season is complete. Life is worth living, and you lived it, one day at a time.'
};
const PLAN_SECTIONS = [
  ['reasons','Things that motivate me toward recovery'],
  ['triggers','My triggers'],
  ['warning','My warning signs'],
  ['coping','Things I can do on my own to cope'],
  ['distract','People and places that distract me'],
  ['help','People I can ask for help','Name, phone — one per line'],
  ['pros','Professionals and crisis lines','Name, phone — one per line'],
  ['safe','Making my environment safe']
];

/* ---------------- State ---------------- */
const KEY='secondwind:v1';
let storageOK=true;
function blank(){return{onboarded:false,name:'',bird:'',startDate:null,plants:[],days:[],checkins:{},hardy:[],plan:{reasons:'',triggers:'',warning:'',coping:'',distract:'',help:'',pros:'988 Suicide & Crisis Lifeline, 988',safe:''},appts:[],times:{am:'08:30',pm:'20:30'},jar:[],seen:[],birdDay:null,birdSeen:{},quoteIdx:0}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){storageOK=false;S=blank()}
S=Object.assign(blank(),S);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}

/* ---------------- Utils ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>dkey();
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function lines(t){return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean)}
function parsePerson(l){const m=l.match(/^(.*?)[\s,:—–-]*([+(]?\d[\d\s().-]{1,}\d)\s*$/);if(!m)return{name:l.trim(),phone:'',tel:''};const name=m[1].trim()||m[2];return{name,phone:m[2].trim(),tel:m[2].replace(/[^\d+]/g,'')}}
function hour(){return new Date().getHours()}
function isMorning(){return hour()<15}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2900)}
function fmtDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function fmtTime(t){if(!t)return'';const [h,m]=t.split(':').map(Number);const d=new Date();d.setHours(h,m);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function daysBetween(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((new Date(pb[0],pb[1]-1,pb[2])-new Date(pa[0],pa[1]-1,pa[2]))/864e5)}

/* growth: cumulative care, never shrinks */
const THRESH=[0,1,3,6,10,15,21,28];
function careCount(p){return (p.tends||[]).length+(p.rests||[]).length}
function stageOf(p){const c=careCount(p);let s=0;THRESH.forEach((t,i)=>{if(c>=t)s=i});return s}
function tendedToday(p){return (p.tends||[]).includes(today())||(p.rests||[]).includes(today())}

/* ---------------- SVG art ---------------- */
function plantSVG(p){
  const st=stageOf(p),c=p.color;
  const H=[0,9,17,25,33,39,45,50][st];
  const top=84-H;
  let leaves='';
  const pairs=Math.min(st,4);
  for(let i=0;i<pairs;i++){
    const y=84-(H*(0.28+i*0.2));
    const s=0.75+i*0.08;
    leaves+=`<path d="M40 ${y} q ${-14*s} ${-4*s} ${-17*s} ${-12*s} q ${10*s} ${-1*s} ${17*s} ${12*s}z" fill="${c}" opacity=".9"/>`;
    leaves+=`<path d="M40 ${y-3} q ${14*s} ${-4*s} ${17*s} ${-12*s} q ${-10*s} ${-1*s} ${-17*s} ${12*s}z" fill="${c}" opacity=".75"/>`;
  }
  let head='';
  if(st===0){head=`<ellipse cx="40" cy="83" rx="4" ry="2.4" fill="#6B4F3A"/><path d="M40 82 q1 -4 3 -5" stroke="${c}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`}
  else if(st===5){head=`<ellipse cx="40" cy="${top-3}" rx="4.5" ry="6.5" fill="${c}"/><ellipse cx="40" cy="${top-4}" rx="2.2" ry="4" fill="#fff" opacity=".35"/>`}
  else if(st>=6){
    const n=st===6?5:8,r=st===6?7:8.5;let pet='';
    for(let i=0;i<n;i++){const a=i*360/n;pet+=`<ellipse cx="40" cy="${top-6-r*0.55}" rx="${r*0.45}" ry="${r*0.75}" fill="${c}" opacity=".88" transform="rotate(${a} 40 ${top-6})"/>`}
    head=pet+`<circle cx="40" cy="${top-6}" r="${st===6?3.4:4}" fill="#F3D9A4"/><circle cx="40" cy="${top-6}" r="1.6" fill="#B8935A"/>`;
  }
  const stem=st>0?`<path d="M40 85 Q ${38} ${84-H/2} 40 ${top}" stroke="${shade(c)}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`:'';
  return `<svg viewBox="0 0 80 112" aria-hidden="true">
    <g class="sway">${stem}${leaves}${head}</g>
    <path d="M22 86 h36 l-4 22 q-1 3 -4 3 h-20 q-3 0 -4 -3z" fill="#C9886F"/>
    <path d="M20 83 h40 q2 0 2 2 v2 q0 2 -2 2 h-40 q-2 0 -2 -2 v-2 q0 -2 2 -2z" fill="#B87660"/>
    <ellipse cx="40" cy="85.5" rx="17" ry="2" fill="#6B4F3A" opacity=".55"/>
  </svg>`;
}
function shade(hex){const n=parseInt(hex.slice(1),16);const r=Math.max(0,(n>>16)-38),g=Math.max(0,((n>>8)&255)-30),b=Math.max(0,(n&255)-38);return `rgb(${r},${g},${b})`}
function winterBloom(){return `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">${[0,72,144,216,288].map(a=>`<ellipse cx="12" cy="7" rx="3.2" ry="5" fill="#F4ECEC" stroke="#DBA898" stroke-width=".6" transform="rotate(${a} 12 12)"/>`).join('')}<circle cx="12" cy="12" r="2.4" fill="#D4B47A"/></svg>`}
function birdSVG(){return `<svg viewBox="0 0 64 54" width="64" height="54" aria-hidden="true"><g class="bob">
  <path d="M10 30 q-8 -2 -9 -8 q6 3 12 3z" fill="#6B8F6E"/>
  <ellipse cx="30" cy="31" rx="18" ry="15" fill="#8DAE82"/>
  <ellipse cx="33" cy="36" rx="11" ry="9" fill="#F1E3C8"/>

/* ---------------- Routing ---------------- */
let view='home', obStep=0;
function render(){
  const app=$('#app');
  if(!S.onboarded){app.innerHTML=onboarding();bindOnboarding();return}
  markShowedUp();
  let body='';
  if(view==='home')body=homeView();
  else if(view==='plan')body=planView(false);
  else if(view==='jar')body=jarView();
  else if(view==='appts')body=apptView();
  else if(view==='settings')body=settingsView();
  app.innerHTML=`<button class="help-pill" data-act="help">Help now</button><div class="shell fade">${storageOK?'':'<div class="banner">This browser isn’t saving your data. Use Settings → Back up to keep a copy.</div>'}${body}</div>${navBar()}`;
  bindMain();
}
function navBar(){
  const it=[['home','Greenhouse','home'],['plan','My plan','plan'],['jar','Good stuff','jar'],['appts','Care','cal'],['settings','Settings','set']];
  return `<nav class="nav">${it.map(([v,l,i])=>`<button data-nav="${v}" class="${view===v?'on':''}">${ICON[i]}${l}</button>`).join('')}</nav>`;
}
function markShowedUp(){if(!S.days.includes(today())){S.days.push(today());save()}}

/* ---------------- Onboarding ---------------- */
const OB_TOTAL=9;
function obFrame(inner,actions){
  const dots=Array.from({length:OB_TOTAL},(_,i)=>`<i class="${i<=obStep?'on':''}"></i>`).join('');
  return `<button class="help-pill" data-act="help">Help now</button><div class="shell"><div class="ob fade">
    <div class="ob-dots">${dots}</div><div class="ob-step">Step ${obStep+1} of ${OB_TOTAL}</div>
    ${inner}<div class="spacer"></div><div class="ob-actions">${actions}</div></div></div>`;
}
const next='<button class="btn block" data-ob="next">Continue</button>';
function onboarding(){
  switch(obStep){
  case 0: return obFrame(`<h1>Hi. I’m glad you’re here.</h1>
    <p class="lead">I’ll walk you through what happens next. It takes about three minutes, and you can stop anytime.</p>
    <label class="lbl" for="ob-name">What should I call you?</label>
    <input class="field" id="ob-name" value="${esc(S.name)}" placeholder="Your first name" autocomplete="given-name">`,
    next+`<label class="link" style="cursor:pointer">Restore from a backup<input type="file" id="ob-import" accept="application/json,.json" hidden></label>`);
  case 1: return obFrame(`<h2>What Second Wind is</h2>
    <p class="lead">It helps with the small things between appointments. It isn’t a therapist or a crisis line.</p>
    <p>If you ever need help right now, the <b style="font-weight:500">Help now</b> button is always at the top of the screen. Let’s look at it together.</p>
    <button class="btn ghost block" data-act="help" style="margin-top:8px">Open Help now</button>`, next);
  case 2: return obFrame(`<h2>Your day</h2>
    <p class="lead">Each morning and evening, I’ll ask a few gentle questions. About two minutes each. That’s all.</p>
    <div class="card"><div class="serif" style="font-size:19px">Morning</div><div class="muted small">How you’re arriving · a few basics · one small thing</div></div>
    <div class="card"><div class="serif" style="font-size:19px">Evening</div><div class="muted small">A few basics · one good thing · how today was</div></div>`, next);
  case 3: {
    const chosen=S.plants.length?S.plants.map(p=>p.id):STARTER.map(p=>p.id);
    return obFrame(`<h2>Plant your seeds</h2>
    <p class="lead">Each seed is one small way of treating yourself well.</p>
    <p class="muted small">Plant all six, or start with fewer. You can add more later.</p>
    <div class="chips" id="seed-chips">${STARTER.map(p=>`<button class="chip ${chosen.includes(p.id)?'on':''}" data-seed="${p.id}">${p.icon} ${p.name}</button>`).join('')}</div>`,
    '<button class="btn block" data-ob="seeds">Plant these</button>');}
  case 4: return obFrame(`<h2>If you miss a day</h2>
    <p class="lead">Nothing bad happens. Your plants rest and wait for you.</p>
    <p>Nothing here wilts, and there are no streaks to break. Growth only adds up. Opening the app on a hard day counts too.</p>
    <p class="muted small">Tip: press and hold a plant to mark a rest day. Rest counts as tending.</p>`, next);
  case 5: return obFrame(`<h2>Keep your plan close</h2>
    <p class="lead">Did your care team give you a safety plan? Let’s keep it here, so it’s always with you.</p>
    <p class="muted small">If you don’t have one yet, that’s okay. Let’s start one together, and finish it with your care team. One item per line.</p>
    ${planForm()}
    <div id="plan-err" class="hint" style="color:var(--clay)"></div>`,
    '<button class="btn block" data-ob="plan">Keep my plan here</button>');
  case 6: return obFrame(`<h2>Your care and your times</h2>
    <p class="lead">When should I check in with you?</p>
    <div class="row"><div style="flex:1"><label class="lbl">Morning</label><input class="field" type="time" id="t-am" value="${S.times.am}"></div>
    <div style="flex:1"><label class="lbl">Evening</label><input class="field" type="time" id="t-pm" value="${S.times.pm}"></div></div>
    <hr class="soft"><div class="serif" style="font-size:20px">Your next appointment</div>
    <p class="muted small">Optional. You can add more under Care.</p>
    ${apptForm()}`, '<button class="btn block" data-ob="times">Continue</button>');
  case 7: return obFrame(`<h2>A visitor</h2>
    <p class="lead">Someone came to meet you.</p>
    <div style="display:flex;justify-content:center;margin:26px 0 30px"><div style="transform:scale(1.8)"><div class="bird-wrap arrive" style="position:relative;top:0;right:0">${birdSVG()}</div></div></div>
    <p>This little bird arrives on the wind now and then. It brings letters, good news and seeds. It never needs anything from you.</p>
    <label class="lbl" for="ob-bird">What would you like to name it?</label>
    <input class="field" id="ob-bird" value="${esc(S.bird)}" placeholder="A name">`, '<button class="btn block" data-ob="bird">Continue</button>');
  case 8: {
    const p=S.plants[0];
    return obFrame(`<h2>Let’s water one together</h2>
    <p class="lead">Tap a plant to water it.</p>
    <div class="greenhouse" style="padding-top:22px">${greenhouseFrame()}<div class="plants">${S.plants.slice(0,3).map(plantTile).join('')}</div></div>
    <p id="ob-done-msg" class="serif" style="font-size:20px;min-height:28px"></p>`,
    '<button class="btn block" data-ob="finish" id="ob-finish" disabled>That’s enough for today</button>');}
  }
}
function planForm(){
  return PLAN_SECTIONS.map(([k,l,h],i)=>`<label class="lbl" for="pl-${k}"><span class="serif" style="color:var(--gold);font-size:17px">${i+1}</span>&nbsp; ${l}</label>
    <textarea class="field" id="pl-${k}" placeholder="${h?esc(h):'One per line'}">${esc(S.plan[k])}</textarea>`).join('');
}
function readPlanForm(){PLAN_SECTIONS.forEach(([k])=>{const el=$('#pl-'+k);if(el)S.plan[k]=el.value.trim()})}
function apptForm(a){a=a||{};return `<label class="lbl">What</label><input class="field" id="ap-what" placeholder="e.g. DBT intake" value="${esc(a.what||'')}">
  <div class="row"><div style="flex:1"><label class="lbl">Date</label><input class="field" type="date" id="ap-date" value="${a.date||''}"></div>
  <div style="flex:1"><label class="lbl">Time</label><input class="field" type="time" id="ap-time" value="${a.time||''}"></div></div>
  <label class="lbl">Where or phone (optional)</label><input class="field" id="ap-where" value="${esc(a.where||'')}">`}
function readAppt(){const what=$('#ap-what').value.trim(),date=$('#ap-date').value;if(!what||!date)return null;return{id:Date.now(),what,date,time:$('#ap-time').value,where:$('#ap-where').value.trim(),note:''}}

function bindOnboarding(){
  const app=$('#app');
  app.querySelectorAll('[data-act="help"]').forEach(b=>b.onclick=openHelp);
  const imp=$('#ob-import');if(imp)imp.onchange=e=>importFile(e.target.files[0]);
  app.querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  app.querySelectorAll('[data-ob]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.ob;
    if(a==='next'){if(obStep===0)S.name=($('#ob-name').value||'').trim();obStep++}
    else if(a==='seeds'){
      const ids=[...app.querySelectorAll('[data-seed].on')].map(x=>x.dataset.seed);
      if(!ids.length){toast('Choose at least one seed.');return}
      S.plants=STARTER.filter(p=>ids.includes(p.id)).map(p=>Object.assign({},p,{tends:[],rests:[]}));obStep++}
    else if(a==='plan'){
      readPlanForm();
      if(!lines(S.plan.coping).length||(!lines(S.plan.help).length&&!lines(S.plan.pros).length)){
        $('#plan-err').textContent='To keep you safe, please add at least one thing you can do on your own (step 4) and one person or professional you can reach (step 6 or 7). You can fill in the rest later.';return}
      obStep++}
    else if(a==='times'){S.times.am=$('#t-am').value||'08:30';S.times.pm=$('#t-pm').value||'20:30';const ap=readAppt();if(ap)S.appts.push(ap);obStep++}
    else if(a==='bird'){S.bird=($('#ob-bird').value||'').trim()||'Wren';obStep++}
    else if(a==='finish'){S.onboarded=true;S.startDate=today();S.birdDay=today();save();view='home';render();toast('I’ll see you this evening.');return}
    save();render();window.scrollTo(0,0);
  });
  if(obStep===8){app.querySelectorAll('.plant').forEach(el=>{el.onclick=()=>{
    const p=S.plants.find(x=>x.id===el.dataset.plant);if(!p||tendedToday(p))return;
    p.tends.push(today());save();
    el.outerHTML=plantTile(p);const ne=app.querySelector(`[data-plant="${p.id}"]`);waterAnim(ne);
    $('#ob-done-msg').textContent='That’s one small way of treating yourself well.';$('#ob-finish').disabled=false;
    bindOnboarding();
  }})}
}

/* ---------------- Home ---------------- */
function plantTile(p){
  const t=tendedToday(p),rest=(p.rests||[]).includes(today());
  return `<button class="plant ${t?'':'dormant'}" data-plant="${p.id}" aria-label="${esc(p.name)}${t?' — tended today':''}">
    <span class="drop"></span>${plantSVG(p)}
    <span class="name">${p.icon} ${esc(p.name)}</span><span class="state">${rest?'resting today':t?'tended today':''}</span></button>`;
}
function greeting(){const h=hour();const g=h<5?'Still up':h<12?'Good morning':h<17?'Good afternoon':'Good evening';return g+(S.name?', '+esc(S.name):'')}
function homeView(){
  const n=S.days.length, season=Math.min(n,90);
  const ci=S.checkins[today()]||{};
  const slot=isMorning()?'am':'pm';
  const done=!!ci[slot];
  const nextAp=upcomingAppts()[0];
  const q=QUOTES[(S.days.length-1)%QUOTES.length];
  const letter=pendingLetter();
  const soon=nextAp&&daysBetween(today(),nextAp.date)<=1;
  return `<div class="top"><h1>${greeting()}.</h1>
    <div class="season"><span class="small muted">Day ${n} of your first season</span><span class="season-bar"><i style="width:${season/90*100}%"></i></span></div></div>
    ${soon?`<div class="banner"><b style="font-weight:500">${daysBetween(today(),nextAp.date)===0?'Today':'Tomorrow'}:</b> ${esc(nextAp.what)}${nextAp.time?' at '+fmtTime(nextAp.time):''}</div>`:''}
    <div class="greenhouse">${greenhouseFrame()}
      ${letter?`<button class="bird-wrap arrive" data-act="letter" aria-label="${esc(S.bird)} brought you a letter">${birdSVG()}<span class="envelope"></span></button>`:''}
      <div class="plants">${S.plants.map(plantTile).join('')}</div>
      ${S.hardy.length?`<div class="hardy">${S.hardy.map(()=>winterBloom()).join('')}<span>${S.hardy.length===1?'A winter bloom':S.hardy.length+' winter blooms'}, grown on hard days you showed up for.</span></div>`:''}
    </div>
    <p class="small muted" style="text-align:center;margin:4px 0 0">Tap a plant when you’ve done it. Press and hold for a rest day.</p>
    <div class="card">
      <div class="row between"><div><div class="serif" style="font-size:21px">${slot==='am'?'Morning check-in':'Evening check-in'}</div>
      <div class="small muted">${done?'Done. Thank you for showing up.':'About two minutes.'}</div></div>
      <button class="btn ${done?'soft':''}" data-act="checkin">${done?'Again':'Begin'}</button></div>
    </div>
    ${nextAp&&!soon?`<div class="card"><div class="small muted">Next appointment</div><div class="serif" style="font-size:20px">${esc(nextAp.what)}</div><div class="small">${fmtDate(nextAp.date)}${nextAp.time?' · '+fmtTime(nextAp.time):''}</div></div>`:''}
    <div class="card"><div class="quote">“${esc(q[0])}”<small>${esc(q[1])}</small></div></div>`;
}
function waterAnim(el){if(!el)return;const d=el.querySelector('.drop');if(d){d.classList.remove('go');void d.offsetWidth;d.classList.add('go')}}
function bindMain(){
  const app=$('#app');
  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;render();window.scrollTo(0,0)});
  app.querySelectorAll('[data-act="help"]').forEach(b=>b.onclick=openHelp);
  const ck=app.querySelector('[data-act="checkin"]');if(ck)ck.onclick=()=>openCheckin(isMorning()?'am':'pm');
  const lt=app.querySelector('[data-act="letter"]');if(lt)lt.onclick=openLetter;
  app.querySelectorAll('.greenhouse .plant').forEach(bindPlant);
  if(view==='plan')bindPlan();if(view==='jar')bindJar();if(view==='appts')bindAppts();if(view==='settings')bindSettings();
}
function bindPlant(el){
  let timer=null,long=false;
  const start=()=>{long=false;timer=setTimeout(()=>{long=true;toggleRest(el.dataset.plant)},550)};
  const end=()=>clearTimeout(timer);
  el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchend',end);el.addEventListener('touchmove',end,{passive:true});
  el.addEventListener('mousedown',start);el.addEventListener('mouseup',end);el.addEventListener('mouseleave',end);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',()=>{if(long){long=false;return}toggleTend(el.dataset.plant)});
}
function refreshPlant(id,anim){const p=S.plants.find(x=>x.id===id);const el=document.querySelector(`.greenhouse [data-plant="${id}"]`);if(!p||!el)return;el.outerHTML=plantTile(p);const ne=document.querySelector(`.greenhouse [data-plant="${id}"]`);bindPlant(ne);if(anim)waterAnim(ne)}
function toggleTend(id){
  const p=S.plants.find(x=>x.id===id);if(!p)return;
  const before=stageOf(p);
  if((p.rests||[]).includes(today())){p.rests=p.rests.filter(d=>d!==today())}
  if(p.tends.includes(today())){p.tends=p.tends.filter(d=>d!==today());save();refreshPlant(id);return}
  p.tends.push(today());save();refreshPlant(id,true);
  toast(stageOf(p)>before?(stageOf(p)===6?'Your '+p.name+' bloomed.':'Your '+p.name+' grew a little.'):pick(WARM));
}
function toggleRest(id){
  const p=S.plants.find(x=>x.id===id);if(!p)return;p.rests=p.rests||[];
  if(p.tends.includes(today()))return;
  if(p.rests.includes(today()))p.rests=p.rests.filter(d=>d!==today());else{p.rests.push(today());toast('Rest counts as tending.')}
  save();refreshPlant(id);
}

/* ---------------- Sheets ---------------- */
function sheet(html,onMount,cls){
  closeSheet();
  const s=document.createElement('div');s.className='scrim';s.id='scrim';
  s.innerHTML=`<div class="sheet ${cls||''}" role="dialog" aria-modal="true"><button class="close" data-close>Close</button>${html}</div>`;
  s.addEventListener('click',e=>{if(e.target===s)closeSheet()});
  document.body.appendChild(s);
  s.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  s.querySelectorAll('[data-act="help"]').forEach(b=>b.onclick=openHelp);
  s.querySelectorAll('[data-act="breathe"]').forEach(b=>b.onclick=openBreath);
  s.querySelectorAll('[data-act="plan"]').forEach(b=>b.onclick=openPlanSheet);
  if(onMount)onMount(s.querySelector('.sheet'));
}
function closeSheet(){const s=$('#scrim');if(s)s.remove()}

function crisisLinks(){return `
  <a class="crisis" href="tel:988"><b>Call 988</b><span>Suicide &amp; Crisis Lifeline · 24/7 · dial 988</span></a>
  <a class="crisis" href="sms:988"><b>Text 988</b><span>Text with a trained counselor · text 988</span></a>
  <a class="crisis lite" href="sms:741741&body=HOME"><b>Text HOME to 741741</b><span>Crisis Text Line</span></a>
  <a class="crisis lite" href="tel:911"><b>Call 911</b><span>If you’re in immediate danger, or go to the nearest ER</span></a>`}
function peopleList(){
  const ppl=lines(S.plan.help).map(parsePerson).concat(lines(S.plan.pros).map(parsePerson).filter(p=>p.tel!=='988'));
  if(!ppl.length)return '<p class="muted small">Add people in your plan to see them here.</p>';
  return ppl.map(p=>`<div class="person"><span>${esc(p.name)}</span>${p.tel?`<a href="tel:${esc(p.tel)}">Call ${esc(p.phone)}</a>`:''}</div>`).join('');
}
function openHelp(){
  sheet(`<h2>You don’t have to do this alone.</h2>
  <p class="muted">Reach out now. Any of these is a good choice.</p>
  ${crisisLinks()}
  <div class="card"><div class="serif" style="font-size:20px;margin-bottom:4px">Your people</div>${peopleList()}</div>
  <div class="row" style="gap:8px"><button class="btn soft" style="flex:1" data-act="plan">My safety plan</button><button class="btn soft" style="flex:1" data-act="breathe">Breathe with me</button></div>`);
}
function openBreath(){
  sheet(`<h2>Box breathing</h2><p class="muted small">Follow the line around the box. Three or four rounds is plenty.</p>
  <div class="breath"><svg viewBox="0 0 120 120"><rect x="10" y="10" width="100" height="100" rx="6" fill="none" stroke="var(--cream-deep)" stroke-width="4"/>
  <path class="trace" pathLength="100" d="M10 110 L10 10 L110 10 L110 110 Z" fill="none" stroke="var(--sage)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="phase" id="phase">Breathe in · 4</div></div>
  <div class="row" style="gap:8px"><button class="btn soft" style="flex:1" data-act="help">Help now</button><button class="btn" style="flex:1" data-close>I’m done</button></div>`,(el)=>{
    const ph=['Breathe in','Hold','Breathe out','Pause'];let t=0;
    const tick=()=>{const ph_el=document.getElementById('phase');if(!ph_el){clearInterval(iv);return}const i=Math.floor(t/4)%4,c=4-(t%4);ph_el.textContent=ph[i]+' · '+c;t++};
    tick();const iv=setInterval(tick,1000);
  });
}
function planHTML(){
  return PLAN_SECTIONS.map(([k,l],i)=>{const items=lines(S.plan[k]);
    const body=(k==='help'||k==='pros')?items.map(parsePerson).map(p=>`<li>${esc(p.name)}${p.tel?` · <a href="tel:${esc(p.tel)}" style="color:var(--moss)">${esc(p.phone)}</a>`:''}</li>`).join(''):items.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="plan-sec"><h4><span class="num">${i+1}</span>${l}</h4>${items.length?`<ul>${body}</ul>`:'<p class="muted small" style="margin:0">Not filled in yet.</p>'}</div>`}).join('');
}
function openPlanSheet(){sheet(`<h2>My safety plan</h2><p class="muted small">Take it one step at a time, in order.</p>${planHTML()}<hr class="soft"><button class="btn block" data-act="breathe">Breathe with me</button><div style="height:8px"></div><button class="btn soft block" data-act="help">Help now</button>`)}

/* ---------------- Check-in ---------------- */
function openCheckin(slot){
  const ci={mood:null,small:null,good:''};
  const basics=slot==='am'?['water','meds','dressed']:['meds','shower','outside','ate'];
  const mine=S.plants.filter(p=>basics.includes(p.id));
  let step=0;
  const steps=slot==='am'?['mood','basics','small','close']:['basics','good','mood','close'];
  function draw(){
    const k=steps[step];let h='';
    if(k==='mood')h=`<h2>${slot==='am'?'How are you arriving today?':'How was today?'}</h2><p class="muted small">There’s no wrong answer.</p>
      <div class="moods">${MOODS.map(([n,l])=>`<button class="mood ${ci.mood===n?'on':''}" data-mood="${n}"><span class="n">${n}</span>${l}</button>`).join('')}</div>
      <button class="btn block" data-go ${ci.mood?'':'disabled'}>Continue</button>`;
    else if(k==='basics')h=`<h2>${slot==='am'?'A few basics':'Tending the greenhouse'}</h2><p class="muted small">Tap what you’ve done. Anything left can wait.</p>
      <div class="chips">${mine.map(p=>`<button class="chip ${p.tends.includes(today())?'on':''}" data-basic="${p.id}">${p.icon} ${esc(p.name)}</button>`).join('')||'<span class="muted small">No basics planted for now.</span>'}</div>
      <button class="btn block" data-go>Continue</button>`;
    else if(k==='small'){const opts=pickN(SMALL_THINGS,5);h=`<h2>One small thing for today</h2><p class="muted small">Pick one, or write your own. Small is the point.</p>
      <div class="chips">${opts.map(o=>`<button class="chip" data-small="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <input class="field" id="small-own" placeholder="Something else">
      <button class="btn block" style="margin-top:14px" data-go>Continue</button>`}
    else if(k==='good')h=`<h2>One thing that happened today</h2><p class="muted small">However small. It goes in your Good stuff jar.</p>
      <textarea class="field" id="good" placeholder="I made tea. I went outside. I texted Maria.">${esc(ci.good)}</textarea>
      <button class="btn block" style="margin-top:14px" data-go>Continue</button>`;
    else if(k==='close'){
      const hard=ci.mood&&ci.mood<=2;
      if(hard){
        if(!S.hardy.includes(today())){S.hardy.push(today());save()}
        h=`<h2>I’m sorry today ${slot==='am'?'is':'was'} hard.</h2>
        <p>This is temporary. Let’s take it one step at a time, starting with your plan.</p>
        <p class="small">If you’re thinking about hurting yourself, call or text <a href="tel:988" style="color:var(--moss);font-weight:500">988</a> now. You can also reach your people below.</p>
        <div class="card" style="max-height:none">${planHTML()}</div>
        ${crisisLinks()}
        <button class="btn soft block" data-act="breathe" style="margin-top:6px">Breathe with me</button>
        <p class="small muted" style="margin-top:16px">You showed up on a hard day. A winter bloom is growing in your greenhouse.</p>
        <button class="btn block" data-done>Back to my greenhouse</button>`;
      }else{
        h=`<h2 style="margin-top:6px">${slot==='am'?'One step at a time.':'Thank you for tending today.'}</h2>
        <p class="lead serif" style="font-size:20px">${slot==='am'?(ci.small?'Today’s small thing: '+esc(ci.small)+'.':'Go gently today.'):'Rest well. I’ll see you in the morning.'}</p>
        <button class="btn block" data-done>Done</button>`;
      }
      const rec=S.checkins[today()]||{};rec[slot]={mood:ci.mood,small:ci.small,at:Date.now()};S.checkins[today()]=rec;save();
    }
    sheet(h,(el)=>{
      el.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{ci.mood=+b.dataset.mood;draw()});
      el.querySelectorAll('[data-basic]').forEach(b=>b.onclick=()=>{const p=S.plants.find(x=>x.id===b.dataset.basic);if(p.tends.includes(today()))p.tends=p.tends.filter(d=>d!==today());else{p.tends.push(today());p.rests=(p.rests||[]).filter(d=>d!==today())}save();b.classList.toggle('on')});
      el.querySelectorAll('[data-small]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-small]').forEach(x=>x.classList.remove('on'));b.classList.add('on');ci.small=b.dataset.small});
      const go=el.querySelector('[data-go]');if(go)go.onclick=()=>{
        const own=el.querySelector('#small-own');if(own&&own.value.trim())ci.small=own.value.trim();
        const g=el.querySelector('#good');if(g){ci.good=g.value.trim();if(ci.good){S.jar.unshift({date:today(),text:ci.good});save()}}
        step++;draw()};
      const dn=el.querySelector('[data-done]');if(dn)dn.onclick=()=>{closeSheet();render()};
    });
  }
  draw();
}
function pickN(a,n){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c.slice(0,n)}

/* ---------------- Bird letters ---------------- */
function pendingLetter(){
  if(S.birdSeen[today()])return null;
  const n=S.days.length;
  const ms=Object.keys(MILESTONES).map(Number).find(d=>n>=d&&!S.seen.includes('m'+d));
  if(ms)return{type:'milestone',key:'m'+ms,text:MILESTONES[ms]};
  const age=S.startDate?daysBetween(S.startDate,today()):0;
  const wk=Math.floor(age/7);
  if(wk>=1&&!S.seen.includes('w'+wk)&&S.plants.length<9)return{type:'seed',key:'w'+wk};
  if(S.birdDay===today())return null;
  const r=(n*7+3)%10; // gentle, deterministic: roughly every few days
  if(r<3&&S.jar.length>2){const j=S.jar[(n*3)%S.jar.length];return{type:'jar',key:'j'+today(),item:j}}
  if(r<5){const q=QUOTES[(n*5)%QUOTES.length];return{type:'quote',key:'q'+today(),q}}
  return null;
}
function openLetter(){
  const L=pendingLetter();if(!L)return;
  const from=`<div class="from">— ${esc(S.bird||'your bird')}</div>`;
  const finish=()=>{S.seen.push(L.key);S.birdSeen[today()]=true;S.birdDay=today();save();closeSheet();render()};
  if(L.type==='seed'){
    const avail=NEW_SEEDS.filter(s=>!S.plants.some(p=>p.id===s.id));
    sheet(`<div class="letter">I found a seed packet on the wind. Ready to plant something new? Only if it feels right.${from}</div>
      <div class="chips">${avail.slice(0,6).map(s=>`<button class="chip" data-new="${s.id}">${s.icon} ${esc(s.name)}</button>`).join('')}</div>
      <button class="btn block" data-plant-new disabled>Plant it</button><div style="text-align:center"><button class="link" data-notyet>Not yet</button></div>`,(el)=>{
      let sel=null;el.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-new]').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=b.dataset.new;el.querySelector('[data-plant-new]').disabled=false});
      el.querySelector('[data-plant-new]').onclick=()=>{const s=NEW_SEEDS.find(x=>x.id===sel);S.plants.push(Object.assign({},s,{tends:[],rests:[]}));toast('A new seed is in the soil.');finish()};
      el.querySelector('[data-notyet]').onclick=finish;
    });
    return;
  }
  let body='';
  if(L.type==='milestone')body=`<div class="letter">${esc(L.text)}${from}</div>`;
  if(L.type==='quote')body=`<div class="letter"><div class="quote">“${esc(L.q[0])}”<small>${esc(L.q[1])}</small></div>${from}</div>`;
  if(L.type==='jar')body=`<div class="letter">I found this in your jar. You wrote it on ${fmtDate(L.item.date)}:<br><br><i>“${esc(L.item.text)}”</i>${from}</div>`;
  sheet(body+'<button class="btn block" data-keep>Keep it</button>',(el)=>{el.querySelector('[data-keep]').onclick=finish});
}

/* ---------------- Plan view ---------------- */
let planEdit=false;
function planView(){
  if(planEdit)return `<div class="top"><h1>My safety plan</h1></div><p class="muted small">One item per line. For people, use “Name, phone”.</p>${planForm()}
    <div style="height:14px"></div><button class="btn block" data-plan-save>Save my plan</button><div style="text-align:center"><button class="link" data-plan-cancel>Cancel</button></div>`;
  return `<div class="top"><h1>My safety plan</h1><p class="muted small" style="margin:6px 0 0">Written with my care team. Take it one step at a time, in order.</p></div>
    <div class="card">${planHTML()}</div>
    <div class="row" style="gap:8px"><button class="btn soft" style="flex:1" data-act="breathe2">Breathe with me</button><button class="btn ghost" style="flex:1" data-plan-edit>Edit</button></div>`;
}
function bindPlan(){
  const a=$('#app');
  const e=a.querySelector('[data-plan-edit]');if(e)e.onclick=()=>{planEdit=true;render()};
  const b=a.querySelector('[data-act="breathe2"]');if(b)b.onclick=openBreath;
  const s=a.querySelector('[data-plan-save]');if(s)s.onclick=()=>{readPlanForm();save();planEdit=false;render();toast('Your plan is saved.')};
  const c=a.querySelector('[data-plan-cancel]');if(c)c.onclick=()=>{planEdit=false;render()};
}

/* ---------------- Good stuff ---------------- */
function jarView(){
  return `<div class="top"><h1>The good stuff</h1><p class="muted small" style="margin:6px 0 0">Small good things, kept somewhere safe.</p></div>
  <div class="card"><textarea class="field" id="jar-new" placeholder="Something good, however small"></textarea><div style="height:10px"></div><button class="btn block" data-jar-add>Add to the jar</button></div>
  ${S.jar.length?S.jar.map((j,i)=>`<div class="card"><div class="small muted">${fmtDate(j.date)}</div><div class="serif" style="font-size:19px">${esc(j.text)}</div></div>`).join(''):'<p class="muted" style="text-align:center">Your jar is waiting for its first good thing.</p>'}`;
}
function bindJar(){const b=$('[data-jar-add]');if(b)b.onclick=()=>{const v=$('#jar-new').value.trim();if(!v)return;S.jar.unshift({date:today(),text:v});save();render();toast('Kept.')}}

/* ---------------- Appointments ---------------- */
function upcomingAppts(){return S.appts.filter(a=>a.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
let apptAdding=false;
function apptView(){
  const up=upcomingAppts(), past=S.appts.filter(a=>a.date<today()).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="top"><h1>Care</h1><p class="muted small" style="margin:6px 0 0">Your appointments, and what you want to remember.</p></div>
  ${apptAdding?`<div class="card">${apptForm()}<div style="height:12px"></div><button class="btn block" data-ap-save>Save</button><div style="text-align:center"><button class="link" data-ap-cancel>Cancel</button></div></div>`:'<button class="btn ghost block" data-ap-add style="margin:12px 0">Add an appointment</button>'}
  ${up.map(a=>`<div class="card"><div class="serif" style="font-size:20px">${esc(a.what)}</div><div class="small">${fmtDate(a.date)}${a.time?' · '+fmtTime(a.time):''}</div>${a.where?`<div class="small muted">${esc(a.where)}</div>`:''}
    <label class="lbl small">Questions to bring</label><textarea class="field" data-note="${a.id}" placeholder="Anything you want to ask">${esc(a.note)}</textarea>
    <button class="link" data-ap-del="${a.id}">Remove</button></div>`).join('')}
  ${past.length?'<hr class="soft"><h3>How did it go?</h3>':''}
  ${past.map(a=>`<div class="card"><div class="serif" style="font-size:19px">${esc(a.what)}</div><div class="small muted">${fmtDate(a.date)}</div>
    <textarea class="field" data-note="${a.id}" placeholder="Anything to remember?" style="margin-top:8px">${esc(a.note)}</textarea></div>`).join('')}
  <hr class="soft"><button class="btn soft block" data-ics>Add reminders to my phone’s calendar</button>
  <p class="hint" style="text-align:center">Adds your daily check-in times and appointments, with gentle reminders.</p>`;
}
function bindAppts(){
  const a=$('#app');
  const add=a.querySelector('[data-ap-add]');if(add)add.onclick=()=>{apptAdding=true;render()};
  const can=a.querySelector('[data-ap-cancel]');if(can)can.onclick=()=>{apptAdding=false;render()};
  const sv=a.querySelector('[data-ap-save]');if(sv)sv.onclick=()=>{const ap=readAppt();if(!ap){toast('Add what it is and the date.');return}S.appts.push(ap);save();apptAdding=false;render()};
  a.querySelectorAll('[data-note]').forEach(t=>t.onchange=()=>{const ap=S.appts.find(x=>String(x.id)===t.dataset.note);if(ap){ap.note=t.value;save();toast('Saved.')}});
  a.querySelectorAll('[data-ap-del]').forEach(b=>b.onclick=()=>{S.appts=S.appts.filter(x=>String(x.id)!==b.dataset.apDel);save();render()});
  const ics=a.querySelector('[data-ics]');if(ics)ics.onclick=downloadICS;
}
function icsDT(date,time){return date.replace(/-/g,'')+'T'+(time||'09:00').replace(':','')+'00'}
function downloadICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Second Wind//EN','CALSCALE:GREGORIAN'];
  const st=today();const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ev=(uid,start,sum,desc,rrule,alarm)=>{L.push('BEGIN:VEVENT','UID:'+uid+'@secondwind','DTSTAMP:'+stamp,'DTSTART:'+start,'DURATION:PT10M','SUMMARY:'+sum,'DESCRIPTION:'+desc);if(rrule)L.push(rrule);L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+sum,'TRIGGER:'+alarm,'END:VALARM','END:VEVENT')};
  ev('am',icsDT(st,S.times.am),'Second Wind · morning check-in','Water your greenhouse. One step at a time.','RRULE:FREQ=DAILY','PT0M');
  ev('pm',icsDT(st,S.times.pm),'Second Wind · evening check-in','Tuck your greenhouse in for the night.','RRULE:FREQ=DAILY','PT0M');
  upcomingAppts().forEach(a=>{ev('ap'+a.id,icsDT(a.date,a.time),a.what,(a.where||'')+(a.note?' · Questions: '+a.note.replace(/\n/g,' '):''),null,'-PT1H');
  });
  L.push('END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')],{type:'text/calendar'});const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download='second-wind-reminders.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/* ---------------- Settings ---------------- */
function settingsView(){
  return `<div class="top"><h1>Settings</h1></div>
  <div class="card"><label class="lbl" style="margin-top:0">Your name</label><input class="field" id="st-name" value="${esc(S.name)}">
  <label class="lbl">Your bird’s name</label><input class="field" id="st-bird" value="${esc(S.bird)}">
  <div class="row"><div style="flex:1"><label class="lbl">Morning</label><input class="field" type="time" id="st-am" value="${S.times.am}"></div><div style="flex:1"><label class="lbl">Evening</label><input class="field" type="time" id="st-pm" value="${S.times.pm}"></div></div>
  <div style="height:12px"></div><button class="btn block" data-st-save>Save</button></div>
  <div class="card"><div class="serif" style="font-size:20px">Your data stays on this phone</div>
  <p class="small muted">Nothing is sent anywhere. That also means if this browser’s data is cleared, it’s gone, so keep a backup now and then.</p>
  <button class="btn soft block" data-export>Download a backup</button><div style="height:8px"></div>
  <label class="btn ghost block" style="cursor:pointer">Restore from a backup<input type="file" id="st-import" accept="application/json,.json" hidden></label></div>
  <div class="card"><div class="serif" style="font-size:20px">About</div><p class="small muted">Second Wind supports you between appointments. It isn’t a therapist or a crisis service. If you’re in danger, call or text 988, or call 911.</p>
  <button class="link" data-reset>Start over</button></div>`;
}
function bindSettings(){
  const a=$('#app');
  a.querySelector('[data-st-save]').onclick=()=>{S.name=$('#st-name').value.trim();S.bird=$('#st-bird').value.trim()||S.bird;S.times.am=$('#st-am').value;S.times.pm=$('#st-pm').value;save();toast('Saved.')};
  a.querySelector('[data-export]').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='second-wind-backup-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)};
  $('#st-import').onchange=e=>importFile(e.target.files[0]);
  a.querySelector('[data-reset]').onclick=()=>sheet(`<h2>Start over?</h2><p>This erases everything on this phone: your greenhouse, plan, jar and appointments. Download a backup first if you might want it.</p>
    <button class="btn block" data-yes style="background:var(--clay)">Erase and start over</button><div style="text-align:center"><button class="link" data-close>Keep everything</button></div>`,(el)=>{el.querySelector('[data-yes]').onclick=()=>{S=blank();save();obStep=0;closeSheet();render()}});
}
function importFile(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(typeof d!=='object'||!d.plan)throw 0;S=Object.assign(blank(),d);save();view='home';closeSheet();render();toast('Welcome back.')}catch(e){toast('That file couldn’t be read.')}};
  r.readAsText(f);
}

/* ---------------- Boot ---------------- */
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.onboarded&&!$('#scrim'))render()});
})();
</script>
</body>
